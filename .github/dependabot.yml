version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /apps/frappe_cpcp
    schedule: {interval: weekly}
