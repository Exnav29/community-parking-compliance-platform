name: Mobile
on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["apps/mobile/**"]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - name: "Build web assets (test build, LAN HTTP allowed for phone testing)"
        run: npx vite build
        env:
          VITE_ALLOW_LAN_HTTP: "1"
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unsigned debug APK (test artifact only; no signing keys in CI)
        run: ./gradlew assembleDebug
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: cpcp-debug-apk-unsigned
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
