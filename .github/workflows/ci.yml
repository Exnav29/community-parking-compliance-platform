name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff
      - run: ruff check apps/frappe_cpcp --select E9,F
      - run: python scripts/gen_doctypes.py && git diff --exit-code
      - run: python scripts/gen_permission_matrix.py && git diff --exit-code docs/security/PERMISSION_MATRIX.md
      - run: python -m pytest
        working-directory: apps/frappe_cpcp
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --redact --no-banner
